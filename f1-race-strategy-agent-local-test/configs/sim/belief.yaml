# The eval's belief simulator (src/eval/score.py race_simulators, docs/eval.md "Who sees
# what"): what a policy plans on. The default SimConfig fitted only on the laps up to the
# snapshot, shrunk toward the practice prior, with traffic off. Its samples carry the
# fit's own uncertainty: posterior parameter draws and residual lap noise (SPEC 0017).
# Wear is bounded below at 0 in every fit (SPEC 0017b): a tyre does not get faster with
# age, so the tools never show it. Physics, set a priori; the cross-race run reports belief
# with and without it, and it comes off if it loses there.
fit_window: to_snapshot
traffic:
  name: none
degradation:
  name: linear_fuel
  params:
    draw: posterior
    wear_lower_bound: 0.0
lap_noise: residual
