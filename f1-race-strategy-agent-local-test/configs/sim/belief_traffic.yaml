# The belief with traffic ON (the policies' switch; docs/eval.md "Traffic"): configs/sim/belief.yaml
# (see its comments) plus the other cars projected forward from what is visible at the snapshot
# only (src/sim/traffic.py, source "projected"; the projection reads data.visible_rows, the
# belief window's clock). Passes are earned, as in the world's traffic; our own clock runs at
# our pace so far; no dirty-air term (its as-of estimate is not identified). Pass it with
# `score --belief-config configs/sim/belief_traffic.yaml`. Opt-in until the fidelity scorecard
# (src/sim/fidelity.py) decides by the finishing-order measures.
# tests/test_traffic_eval_params.py checks this is belief.yaml plus traffic only.
pit_loss:
  source: asof
fit_window: to_snapshot
traffic:
  name: ghost
  params:
    source: projected
    own_pace: true
    pass_mode: earned
events:
  name: rate
  params:
    as_of: true
    duration: history   # as belief.yaml
degradation:
  name: linear_fuel
  params:
    draw: posterior
    wear_lower_bound: 0.0
    driver_effects: race
lap_noise: persistent
belief_cliff_edge: point   # as belief.yaml
calibrator:
  name: as_of_history
fuel_anchor:
  prior: anchored
  practice: anchored
# The tyre sets at the snapshot (docs/eval.md "Tyre sets at the snapshot", adopted 2026-11-22; before:
# configs/sim/legacy/belief_pre_tyre_inventory.yaml): the as-of inventory, a later stint on the best set of its compound left
tyre_inventory: true
# The thin-fit guard (docs/eval.md "Thin fits in the belief", adopted 2026-11-22; before:
# configs/sim/legacy/belief_pre_belief_guard.yaml): a compound whose visible clean race rows come from fewer than 3
# drivers or number fewer than 40 has its level and wear shrunk toward the well-covered compounds and the as-of wear history
belief_guard:
  enabled: true
  mode: pace_wear
  min_drivers: 3
  min_rows: 40
  scale_sd_by_drivers: true
