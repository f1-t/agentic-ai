# WRITTEN by `python -m src.sim.learned_calibrator train` (src/sim/learned_calibrator.py): configs/sim/belief.yaml with the trained
# learned calibrator (calibrators.TrainedCalibrator: the leave-one-out model for a calibration
# race, the all-races model for any other). NOT adopted by the default rule: an option; configs/sim/belief.yaml keeps shrinkage.
# Do not edit by hand; rerun the command.
pit_loss:
  source: asof
fit_window: to_snapshot
traffic:
  name: none
events:
  name: rate
  params:
    as_of: true   # the SC/VSC rates as of the race, as belief.yaml (docs/eval.md "Cross-race tables, as of the race")
    duration: history   # period lengths as of the race, as belief.yaml
degradation:
  name: linear_fuel
  params:
    draw: posterior
    wear_lower_bound: 0.0
    driver_effects: race
lap_noise: persistent
belief_cliff_edge: point   # the wear-cliff edge at its point, as belief.yaml
calibrator:
  name: trained
  params:
    artifacts: models/calibrators/ridge_hybrid
    sha256: f57c93918dfe
fuel_anchor:
  prior: anchored
  practice: anchored
# The tyre sets at the snapshot (docs/eval.md "Tyre sets at the snapshot", adopted 2026-11-22; before:
# configs/sim/legacy/belief_pre_tyre_inventory.yaml): the as-of inventory, a later stint on the best set of its compound left
tyre_inventory: true
