# race, the all-races model for any other). NOT adopted by the default rule: an option; configs/sim/belief.yaml keeps shrinkage.
# Do not edit by hand; rerun the command.
pit_loss:
  source: asof
fit_window: to_snapshot
traffic:
  name: none
events:
  name: rate
  params:
    as_of: true   # the SC/VSC rates as of the race, as belief.yaml (docs/eval.md "Cross-race tables, as of the race")
degradation:
  name: linear_fuel
  params:
    draw: posterior
    wear_lower_bound: 0.0
lap_noise: persistent
calibrator:
  name: trained
  params:
    artifacts: models/calibrators/ridge_hybrid
    sha256: f57c93918dfe
fuel_anchor:
  prior: anchored
  practice: anchored
