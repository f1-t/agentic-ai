# The belief with traffic ON and the as-of passing difficulty (docs/eval.md "Overtaking
# difficulty"): configs/sim/belief_traffic.yaml (the other cars projected from what is visible at
# the snapshot) with the hazard pass rule, its threshold from data/derived/overtaking.csv read as
# of the race (src/sim/overtaking.py difficulty_prior: races strictly before this one, never a
# held-out race; provenance "overtaking_difficulty"). Opt-in.
pit_loss:
  source: asof
fit_window: to_snapshot
traffic:
  name: ghost
  params:
    source: projected
    own_pace: true
    pass_mode: earned
    difficulty: asof
events:
  name: rate
  params:
    as_of: true
    duration: history   # as belief.yaml
degradation:
  name: linear_fuel
  params:
    draw: posterior
    wear_lower_bound: 0.0
    driver_effects: race
lap_noise: persistent
belief_cliff_edge: point   # as belief.yaml
calibrator:
  name: as_of_history
fuel_anchor:
  prior: anchored
  practice: anchored
# The tyre sets at the snapshot (docs/eval.md "Tyre sets at the snapshot", adopted 2026-11-22; before:
# configs/sim/legacy/belief_pre_tyre_inventory.yaml): the as-of inventory, a later stint on the best set of its compound left
tyre_inventory: true
# The thin-fit guard (docs/eval.md "Thin fits in the belief", adopted 2026-11-22; before:
# configs/sim/legacy/belief_pre_belief_guard.yaml): a compound whose visible clean race rows come from fewer than 3
# drivers or number fewer than 40 has its level and wear shrunk toward the well-covered compounds and the as-of wear history
belief_guard:
  enabled: true
  mode: pace_wear
  min_drivers: 3
  min_rows: 40
  scale_sd_by_drivers: true
