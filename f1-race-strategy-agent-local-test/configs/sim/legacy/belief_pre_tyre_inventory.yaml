# LEGACY, for reproducing results produced before the tyre sets were adopted (docs/eval.md
# "The current configuration", adopted 2026-11-22): configs/sim/belief.yaml as it was from v3 to
# the tyre sets' adoption (every later stint on a new set). Pair it with
# configs/sim/legacy/world_pre_tyre_inventory.yaml.
# The eval's belief simulator (src/eval/score.py race_simulators, docs/eval.md "Who sees
# what"): what a policy plans on. The default SimConfig fitted only on the laps up to the
# snapshot, shrunk toward the practice prior, with traffic off. Its samples carry the
# fit's own uncertainty: posterior parameter draws and residual lap noise (SPEC 0017).
# Wear is bounded below at 0 in every fit (SPEC 0017b): a tyre does not get faster with
# age, so the tools never show it. Physics, set a priori, and no worse on Spain's predicted
# gain at real pit stops (stop-gain mae 0.99 s against 1.15 s without); the cross-race run
# (0016 wear_nonneg) reports belief with and without it, and it comes off if it loses there.
# Safety car and VSC periods are drawn from the rate model (src/sim/events.py) with the rates
# fitted on the races before this one (as_of: race_history.as_of_event_rates, event_rates'
# global level shrunk toward the a priori race_history.EVENT_PRIOR; that prior with no earlier
# race), so the belief carries the chance of a cheap stop under SC. as_of false takes the
# EventModel defaults (Spain-derived, the earlier belief). Circuit rates in RaceParams (SPEC
# 0011b) override both. Belief-side draws use seed + agent_tools.BELIEF_SEED_OFFSET, so the
# belief never plans on the event samples the world scores on.
# Every number estimated from other races is read as of the race (docs/eval.md "Information
# contract"): the as_of_history calibrator takes the practice-to-race base delta, the fuel prior
# (circuit history, else the a priori physics prior), the SC lap factor and the lap-1 extra from
# configs/sim/race_history.csv, races strictly before this one (race_history.A_PRIORI with none);
# the shrinkage calibrator ("shrinkage") is the earlier, Spain-derived belief.
# Fuel anchoring (docs/eval.md "Fuel anchoring"): fuel_anchor.prior "anchored" takes the fuel prior
# as the lap-scaled physics slope (0.03 s/kg at a 90 s lap, 110 kg over the scheduled laps, scaled
# by this weekend's practice lap) times the ratio target / physics of the races before this one,
# with that ratio's predictive sd; fuel_anchor.practice "anchored" fits the practice wear net of
# the same fuel slope. prior "circuit_history" and practice "config" give the belief before it (#102).
calibrator:
  name: as_of_history
fuel_anchor:
  prior: anchored
  practice: anchored
# Pit loss as of the snapshot (src/sim/pit_loss.py, docs/eval.md "Pit loss and track status"):
# a prior from earlier races at the circuit, else across circuits, updated with this race's
# green stops seen by then, drawn per sample with its sd; the SC and VSC factors likewise. The
# belief never sees the whole-race pit loss the world scores with.
pit_loss:
  source: asof
fit_window: to_snapshot
traffic:
  name: none
events:
  name: rate
  params:
    as_of: true
    # the length of a period, and the rest of one in progress given its laps so far, from the
    # as-of history of period lengths (race_history.period_lengths), not a memoryless geometric
    # (docs/eval.md "Safety-car duration and rates", adopted 2026-11-22; before:
    # configs/sim/legacy/belief_pre_sc_alignment.yaml)
    duration: history
# Driver effects (docs/eval.md "What the ablation says"): per-driver pace offsets fitted on the race
# rows visible at the snapshot, as in the world's wear fit. The fidelity scorecard's best belief
# factor: plan-rank agreement with the judge +0.031 [+0.007, +0.053], judge-regret of the belief's
# favourite -1.0 [-1.8, -0.3] s on 18 races. Without them: degradation.params.driver_effects "off".
degradation:
  name: linear_fuel
  params:
    draw: posterior
    wear_lower_bound: 0.0
    driver_effects: race
# Persistent lap noise (docs/eval.md "Honest uncertainty"): the residuals are autocorrelated, so
# each sample draws one offset per plan stint (the as-of driver-stint residual sd) plus the
# lap-to-lap part iid. "residual" (iid, residual_s) is the belief before it. The coverage-chosen
# parameter widening (degradation.params.sd_scale, 1.75 per kind) is a switch, off: it worsened
# the replay order measures.
lap_noise: persistent
# The wear-cliff edge at its point in every sample, max(seen so far, prior), the edge the judge's
# history_only prior uses, not drawn per sample (docs/eval.md "Belief priors"): judge-regret of the
# belief's favourite -0.20 s [-0.38, -0.06], more early in the race. Adopted 2026-11-22 (v3); before:
# configs/sim/legacy/belief_pre_v3.yaml ("draw").
belief_cliff_edge: point
