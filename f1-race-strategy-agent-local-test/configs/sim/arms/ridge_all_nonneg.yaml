# Learned-calibrator comparison arm "ridge_all_nonneg" (src/sim/learned_calibrator.py): ridge
# with the event factors as targets too, under the belief's wear bound. Its degradation fits are
# the ridge_nonneg ones; the adoption rule reads its event factors.
degradation:
  name: linear_fuel
  params:
    wear_lower_bound: 0.0
calibrator:
  name: ridge
  params:
    targets: all
