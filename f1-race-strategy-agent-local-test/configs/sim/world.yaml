# An eval world simulator with traffic: pass it with `score --world-config`
# (docs/eval.md "Who sees what"). The eval's default world (score.race_simulators: the full fit
# window, config.WORLD_DEGRADATION's wear fit, the wear cliff on) with ghost-car traffic on
# (src/sim/traffic.py, docs/traffic.md) for position regret (SPEC 0014 D).
# Without --world-config the world is that default with traffic off.
fit_window: full
degradation:
  name: linear_fuel_hinge
  params:
    driver_effects: race
traffic:
  name: ghost
