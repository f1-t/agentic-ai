# The world with traffic ON (the scorer's switch; docs/eval.md "Traffic"): pass it with
# `score --world-config configs/sim/world.yaml`. The eval's default world (score.race_simulators:
# the full fit window, config.WORLD_DEGRADATION's wear fit, the wear cliff on with edge
# config.WORLD_EDGE, SC/VSC score.WORLD_EVENTS) with ghost-car traffic: every other car's recorded
# laps as ghosts, which the scorer may read (it is never a policy). Without --world-config the
# world is that default with traffic OFF. Kept OFF by the fidelity scorecard: no order gain in the
# whole-field replay on 19 races, worse relative gaps early (docs/eval.md "What the ablation says").
#   align_neutral   the ghosts keep their gaps on a lap the world runs green but the record
#                   ran under SC/VSC, and the reverse
#   own_pace        our clock among the ghosts runs at the driver's own whole-race pace
#   pass_mode       earned: no pass grants time (the old swap rule conjured it); a faster
#                   car attacks from behind in dirty air until its own pace takes it past
#   dirty_air_auto  dirty_air_s from the race's laps within 1.5 s of the car ahead
# tests/test_traffic_eval_params.py checks this is the default world plus traffic only.
fit_window: full
degradation:
  name: linear_fuel
  params:
    driver_effects: race
wear_cliff:
  world_edge: history_only
wear_guard:   # the thin-fit wear guard, as world_hybrid.yaml (adopted 2026-11-22)
  enabled: true
  scale_sd_by_drivers: true
sc_queue:
  enabled: true
  mode: single
  held_behind_laps: 1.25
  placement: record
events:
  name: hybrid
  params:
    lap_times: recorded
    duration: history   # later periods: rates and lengths pooled over the history table (adopted 2026-11-22)
    pooled: true
traffic:
  name: ghost
  params:
    align_neutral: true
    own_pace: true
    pass_mode: earned
    dirty_air_auto: true
# The tyre sets at the snapshot (docs/eval.md "Tyre sets at the snapshot", adopted 2026-11-22; before:
# configs/sim/legacy/world_pre_tyre_inventory.yaml): the as-of inventory, a later stint on the best set of its compound left
tyre_inventory: true
