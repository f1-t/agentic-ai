# Default factor switches for `python -m src.sim.fidelity ablate` (docs/eval.md "Simulator
# fidelity"). Each factor is an overlay on the base configuration: `both` goes to the judge (world)
# and the predictive simulator (belief), `world` / `belief` to one of them, `world_file` /
# `belief_file` read a config file as the overlay, `world_race` overrides the judge's race
# constants (pit_loss_s: a number or "prior"). `requires` lists modules the switch needs. A factor
# whose switch is not on the branch (a module missing, a file missing, or an overlay SimConfig
# rejects because the field does not exist yet) is skipped with a note, never an error, so this
# file can name switches that land later. `all_on` is the chosen "everything on" configuration
# (its absent factors are left out).
#
# The base is the eval's default world, the scorecard-chosen configuration (score.default_world_config
# of config.world_default: linear_fuel with driver effects, config.WORLD_DEGRADATION; the wear cliff
# with world_edge "history_only", config.WORLD_EDGE; SC/VSC hybrid, score.WORLD_EVENTS; R8 retired;
# traffic off) and configs/sim/belief.yaml (linear_fuel with driver effects, wear bound 0, fuel
# anchoring, persistent lap noise, as-of pit loss and cliff). Each adopted choice has a factor that
# switches it back off (world_events_off, cliff_edge_history, belief_no_driver_effects, and the
# judge's wear fit world_linear / world_hinge); the rejected ones stay as factors that switch them on.
factors:
  # traffic (sim/traffic.py, docs/eval.md "Traffic"): the order measures are why it exists
  world_traffic:
    note: the judge with ghost-car traffic (configs/sim/world.yaml, score.WORLD_TRAFFIC_CONFIG; recorded ghosts, own pace, earned passes, auto dirty air)
    world_file: configs/sim/world.yaml
  belief_traffic:
    note: the belief with the projected field (configs/sim/belief_traffic.yaml, score.BELIEF_TRAFFIC_CONFIG; visible rows only)
    belief_file: configs/sim/belief_traffic.yaml
  traffic_both:
    note: traffic in the judge and the belief
    world_file: configs/sim/world.yaml
    belief_file: configs/sim/belief_traffic.yaml
  world_events_off:
    note: the judge without SC/VSC (the world before the adoption drew none; the base's hybrid events, configs/sim/world_hybrid.yaml, replay whole races as `recorded` and run the plan panel as `hybrid`)
    world: {events: {name: none}}
  world_linear:
    note: the judge's wear fit, neither (linear_fuel, no driver effects; the world before WORLD_DEGRADATION)
    world: {degradation: {name: linear_fuel, params: {driver_effects: "off"}}}
  world_hinge:
    note: the judge's wear fit with the hinge too (linear_fuel_hinge with driver effects, configs/sim/world_de_hinge.yaml)
    world: {degradation: {name: linear_fuel_hinge}}
  belief_no_driver_effects:
    note: the belief without driver effects in its fits (configs/sim/legacy/belief_pre_scorecard.yaml)
    belief: {degradation: {params: {driver_effects: "off"}}}
  belief_hinge:
    note: the belief on linear_fuel_hinge
    belief: {degradation: {name: linear_fuel_hinge}}
  wear_lower_bound_judge:
    note: wear bounded below at 0 in the judge too (the belief already has it)
    world: {degradation: {params: {wear_lower_bound: 0.0}}}
  no_wear_lower_bound_belief:
    note: the belief without its wear bound
    belief: {degradation: {params: {wear_lower_bound: null}}}
  compound_proxy_off:
    note: no proxy pricing of unraced compounds, judge and belief
    both: {compound_proxy: {enabled: false}}
  belief_pit_loss_prior_only:
    note: the belief prices stops at the snapshot's pre-race prior, not the as-of estimate updated with this race's stops
    belief: {pit_loss: {source: snapshot}}
  learned_trained:
    note: the belief with the trained learned calibrator (configs/sim/belief_learned.yaml, committed artifacts)
    belief_file: configs/sim/belief_learned.yaml
  # the wear cliff's edge in the judge (sim/cliff.py world_cliffs; base "history_only": the
  # historical prior, nothing from this race)
  cliff_edge_history:
    note: the judge's edge from the historical prior extended by this race's tyre ages (the world before the adoption)
    world: {wear_cliff: {world_edge: history}}
  cliff_edge_race:
    note: the judge's edge from this race alone (the oldest age raced, the earlier design)
    world: {wear_cliff: {world_edge: race}}
  wear_cliff_off:
    note: no wear cliff in either simulator (and no R8), linear wear past every edge
    both: {wear_cliff: {enabled: false}}
  r8_legacy:
    note: the retired R8 hindsight limit on and the cliff off in both (configs/sim/legacy/*_r8.yaml)
    both: {stint_limit_margin_laps: 3, wear_cliff: {enabled: false}}
  # the safety-car queue (sim/sc_queue.py, off by default: not adopted). The base judge is hybrid SC/VSC
  sc_queue:
    note: the judge places each simulated car in the SC queue among the other cars' recorded race (mode single)
    world: {sc_queue: {enabled: true, mode: single}}
  sc_queue_field:
    note: the judge's whole-race replays queue every replayed car together (mode field; Section A only)
    world: {sc_queue: {enabled: true, mode: field}}
  sc_queue_both:
    note: the single-car queue in the judge and in the belief (the field visible at the snapshot)
    world: {sc_queue: {enabled: true, mode: single}}
    belief: {sc_queue: {enabled: true, mode: single}}
  sc_queue_traffic:
    note: the single-car queue with the earned-pass ghost traffic in the judge (the order holds in a train unless a car has the pace)
    world: {sc_queue: {enabled: true, mode: single}, traffic: {name: ghost, params: {align_neutral: true, own_pace: true, pass_mode: earned, dirty_air_auto: true}}}
  # safety-car alignment (events.RateEvents duration "history", race_history.period_lengths)
  belief_sc_history:
    note: the belief's SC/VSC lengths from the as-of history of period lengths (a period in progress continues given its laps so far), not a memoryless geometric
    belief: {events: {name: rate, params: {as_of: true, duration: history}}}
  judge_sc_pooled:
    note: the judge's later periods (after the one in progress) at rates and lengths pooled over the dry races of the history table
    world: {events: {name: hybrid, params: {lap_times: recorded, duration: history, pooled: true}}}
  sc_aligned:
    note: both of the above
    belief: {events: {name: rate, params: {as_of: true, duration: history}}}
    world: {events: {name: hybrid, params: {lap_times: recorded, duration: history, pooled: true}}}
# everything on: the base holds every adopted choice, so all_on adds the rejected traffic to it
all_on: [traffic_both]
