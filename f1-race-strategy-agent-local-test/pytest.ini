[pytest]
pythonpath = .
testpaths = tests
python_files = test_sim*.py test_contracts.py test_future_blindness.py test_baselines*.py test_optimizer_bridge.py test_eval*.py test_snapshot*.py test_openf1.py test_offline*.py test_traffic*.py
# Three tiers (README, "Testing"): the default run is the fast tier; -m "slow and not legacy" is the
# real-race integration tier (CI runs both); -m legacy runs the checks that legacy switches still run
addopts = -m "not slow and not legacy"
markers =
    slow: real-race or end-to-end integration checks on current behaviour; deselected by default, run in CI
    legacy: a legacy switch or superseded record still loads and runs; deselected by default, not in CI
    compound_proxy_off: SimConfig's default compound_proxy is off for the test (tests/conftest.py)
    wear_cliff_off: SimConfig's default wear_cliff is off for the test (tests/conftest.py)
filterwarnings =
    error::RuntimeWarning
