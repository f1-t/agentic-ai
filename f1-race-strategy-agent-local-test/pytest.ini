[pytest]
pythonpath = .
testpaths = tests
python_files = test_sim*.py test_contracts.py test_baselines*.py test_optimizer_bridge.py test_eval*.py test_snapshot*.py test_openf1.py test_offline*.py
# slow tests are deselected by default; the full set: -m "slow or not slow" (README, Reproducibility notes)
addopts = -m "not slow"
markers =
    slow: minutes-long end-to-end runs (the synthetic ridge cross runs), deselected by default
    compound_proxy_off: SimConfig's default compound_proxy is off for the test (tests/conftest.py)
    wear_cliff_off: SimConfig's default wear_cliff is off for the test (tests/conftest.py)
filterwarnings =
    error::RuntimeWarning
